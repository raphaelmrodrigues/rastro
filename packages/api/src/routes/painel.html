<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rastro — painel</title>
<style>
  :root{--base:#151824;--surface:#1e2233;--linha:#2c3145;--ink:#eef1f8;--fraco:#9ba1b8;--tenue:#6b7290;--dourado:#e8a33d;--perigo:#e05c5c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--base);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:20px;margin:0 0 4px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--tenue);margin:32px 0 12px;font-weight:600}
  .sub{color:var(--fraco);font-size:13px;margin:0 0 24px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .card{background:var(--surface);border-radius:12px;padding:16px}
  .card .n{font-size:28px;font-weight:700;line-height:1.1}
  .card .r{font-size:12px;color:var(--fraco);margin-top:4px}
  .card .h{font-size:11px;color:var(--tenue);margin-top:6px}
  .card.alerta .n{color:var(--perigo)}
  table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--linha)}
  th{color:var(--tenue);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  tr:last-child td{border-bottom:none}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .tabela-rolavel{overflow-x:auto}
  .vazio{color:var(--tenue);font-size:13px;padding:16px;background:var(--surface);border-radius:12px}
  .login{max-width:320px;margin:15vh auto;background:var(--surface);padding:24px;border-radius:14px}
  input{width:100%;padding:11px 12px;margin:6px 0;background:var(--base);border:1px solid var(--linha);border-radius:8px;color:var(--ink);font-size:15px}
  button{width:100%;padding:11px;margin-top:10px;background:var(--dourado);color:#241a08;border:0;border-radius:8px;font-weight:600;font-size:15px;cursor:pointer}
  button.leve{background:transparent;color:var(--fraco);border:1px solid var(--linha);width:auto;padding:7px 14px;font-size:13px;margin:0}
  .erro{color:var(--perigo);font-size:13px;margin-top:10px}
  .topo{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .barras{display:flex;align-items:flex-end;gap:3px;height:64px;background:var(--surface);border-radius:12px;padding:12px}
  .barra{flex:1;background:var(--dourado);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--dourado)}
  .msg{color:var(--fraco);font-size:12px;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>

<script>
// Painel do dono. Usa o MESMO login do app — nao existe senha separada aqui.
// O token fica so em sessionStorage: fechar a aba encerra o acesso.
const $ = (id) => document.getElementById(id);
const app = $('app');
const CHAVE = 'rastro:painel:token';

const nf = new Intl.NumberFormat('pt-BR');
const num = (n) => nf.format(n ?? 0);
const dt = (v) => v ? new Date(v).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}) : '—';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function telaDeLogin(aviso) {
  app.innerHTML = `
    <div class="login">
      <h1>Painel do Rastro</h1>
      <p class="sub">Entre com sua conta de administrador.</p>
      <input id="email" type="email" placeholder="E-mail" autocomplete="username">
      <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
      <button id="entrar">Entrar</button>
      ${aviso ? `<div class="erro">${esc(aviso)}</div>` : ''}
    </div>`;
  const enviar = async () => {
    const r = await fetch('/auth/login', {
      method: 'POST', headers: {'content-type':'application/json'},
      body: JSON.stringify({ email: $('email').value.trim(), password: $('senha').value }),
    });
    if (!r.ok) return telaDeLogin('E-mail ou senha incorretos.');
    const { accessToken } = await r.json();
    sessionStorage.setItem(CHAVE, accessToken);
    carregar();
  };
  $('entrar').onclick = enviar;
  $('senha').onkeydown = (e) => { if (e.key === 'Enter') enviar(); };
}

function cards(itens) {
  return `<div class="cards">${itens.map(c => `
    <div class="card${c.alerta ? ' alerta' : ''}">
      <div class="n">${num(c.n)}</div>
      <div class="r">${esc(c.r)}</div>
      ${c.h ? `<div class="h">${esc(c.h)}</div>` : ''}
    </div>`).join('')}</div>`;
}

function tabela(colunas, linhas, vazio) {
  if (!linhas.length) return `<div class="vazio">${esc(vazio)}</div>`;
  return `<div class="tabela-rolavel"><table>
    <thead><tr>${colunas.map(c => `<th${c.num ? ' style="text-align:right"' : ''}>${esc(c.t)}</th>`).join('')}</tr></thead>
    <tbody>${linhas.map(l => `<tr>${l.map((v,i) => `<td class="${colunas[i].num ? 'num' : ''}">${v}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function render(d) {
  const pico = Math.max(1, ...d.serieDeContas.map(p => p.n));
  const barras = d.serieDeContas.length
    ? `<div class="barras">${d.serieDeContas.map(p =>
        `<div class="barra" style="height:${Math.round(p.n/pico*100)}%" title="${esc(p.dia)}: ${p.n}"></div>`).join('')}</div>`
    : '<div class="vazio">Nenhuma conta criada nos últimos 30 dias.</div>';

  app.innerHTML = `<div class="wrap">
    <div class="topo">
      <div>
        <h1>Painel do Rastro</h1>
        <p class="sub">Atualizado ${dt(d.geradoEm)}</p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="leve" id="recarregar">Atualizar</button>
        <button class="leve" id="sair">Sair</button>
      </div>
    </div>

    <h2>Contas</h2>
    ${cards([
      {n:d.contas.ativas, r:'contas ativas'},
      {n:d.contas.ultimos7, r:'criadas em 7 dias'},
      {n:d.contas.ultimos30, r:'criadas em 30 dias'},
      {n:d.contas.excluidas, r:'excluídas', h:'pedido do usuário'},
    ])}

    <h2>Quem voltou</h2>
    ${cards([
      {n:d.ativos.dia, r:'ativos hoje'},
      {n:d.ativos.semana, r:'ativos em 7 dias'},
      {n:d.ativos.mes, r:'ativos em 30 dias'},
    ])}
    <p class="sub" style="margin-top:12px">
      Conta ativa é sessão usada, não conta criada. A diferença entre "contas" e "ativos"
      é quanta gente instalou e não voltou.
    </p>

    <h2>Contas por dia (30 dias)</h2>
    ${barras}

    <h2>Arquivos importados</h2>
    ${cards([
      {n:d.imports.total, r:'imports no total'},
      {n:d.imports.ultimos7, r:'em 7 dias'},
      {n:d.imports.perfis, r:'perfis com pelo menos 1'},
    ])}
    <p class="sub" style="margin-top:12px">
      Se "contas ativas" é muito maior que "perfis com pelo menos 1", gente está criando
      conta e desistindo antes de conseguir o arquivo. É o gargalo do produto.
    </p>

    <h2>Avisos de leitura do arquivo (30 dias)</h2>
    ${tabela(
      [{t:'Código'},{t:'Relatos',num:true},{t:'Entradas afetadas',num:true},{t:'Último'}],
      d.parsing.map(f => [`<code>${esc(f.codigo)}</code>`, num(f.relatos), num(f.entradas), dt(f.ultimo)]),
      'Nenhum aviso de parsing. É o estado saudável.')}
    <p class="sub" style="margin-top:12px">
      <code>UNKNOWN_FILE_SHAPE</code> ou <code>ENTRIES_SKIPPED</code> subindo significa que o
      Instagram mudou o formato do export — e que o app está mostrando dado errado agora.
    </p>

    <h2>Erros que derrubaram o app</h2>
    ${cards([
      {n:d.crashes.ultimos7, r:'em 7 dias', alerta:d.crashes.ultimos7>0},
      {n:d.crashes.total, r:'no total'},
    ])}
    <div style="margin-top:12px">
    ${tabela(
      [{t:'Erro'},{t:'Mensagem'},{t:'Tela'},{t:'Versão'},{t:'Quando'}],
      d.crashes.recentes.map(c => [
        `<code>${esc(c.name)}</code>`,
        `<div class="msg" title="${esc(c.message)}">${esc(c.message)}</div>`,
        esc(c.screen ?? '—'), esc(c.versao ?? '—'), dt(c.em)]),
      'Nenhum erro registrado.')}
    </div>

    <h2>Onde o app roda</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">
      ${tabela([{t:'Plataforma'},{t:'Usuários',num:true}],
        d.plataformas.map(p => [esc(p.rotulo), num(p.n)]), 'Sem sessões.')}
      ${tabela([{t:'Formato do export'},{t:'Imports',num:true}],
        d.formatos.map(f => [esc(f.rotulo), num(f.n)]), 'Sem imports.')}
      ${tabela([{t:'Versão do app'},{t:'Relatos',num:true}],
        d.versoes.map(v => [esc(v.rotulo), num(v.n)]), 'Sem relatos.')}
    </div>

    <h2>Contas mais recentes</h2>
    ${tabela([{t:'E-mail'},{t:'Criada em'}],
      d.recentes.map(u => [esc(u.email), dt(u.em)]),
      'Nenhuma conta ainda.')}
    <p class="sub" style="margin-top:12px">
      E-mails mascarados de propósito. O painel serve para saber que contas estão entrando,
      não para ler quem entrou — e nada de dado importado de usuário aparece aqui.
    </p>
  </div>`;

  $('recarregar').onclick = carregar;
  $('sair').onclick = () => { sessionStorage.removeItem(CHAVE); telaDeLogin(); };
}

async function carregar() {
  const token = sessionStorage.getItem(CHAVE);
  if (!token) return telaDeLogin();
  app.innerHTML = '<div class="wrap"><p class="sub">Carregando…</p></div>';
  const r = await fetch('/admin/metrics', { headers: { authorization: `Bearer ${token}` } });
  if (r.status === 401 || r.status === 404) {
    sessionStorage.removeItem(CHAVE);
    return telaDeLogin(r.status === 404 ? 'Esta conta não tem acesso ao painel.' : 'Sessão expirada.');
  }
  if (!r.ok) return telaDeLogin('Não foi possível carregar os números.');
  render(await r.json());
}

carregar();
</script>
</body>
</html>
